name: Supabase keepalive

# Prevents Supabase free-tier auto-pause (triggered after 7 days of no DB
# activity) by writing a real heartbeat row to a dedicated _keepalive table
# on a schedule. The write is a genuine Postgres transaction — heavier than
# a bare SELECT, and harder for Supabase's pause-scanner to discount as
# "insufficient activity".
#
# Setup (one-time):
#
#   1. Apply supabase/migrations/20260516_keepalive_table.sql to your
#      Supabase project — either via `supabase db push` (CLI) or by pasting
#      the contents into the SQL editor in Supabase Studio. Creates the
#      _keepalive table that this workflow writes to.
#
#   2. Add two repository secrets under
#      Settings → Secrets and variables → Actions → New repository secret
#        SUPABASE_URL          e.g. https://mqvqqouomdoinkpzuewc.supabase.co
#        SUPABASE_SERVICE_KEY  the secret/service_role key (NOT publishable —
#                              RLS blocks anon writes on _keepalive)
#
# Note: GitHub disables scheduled workflows on a repo after 60 days of no
# commits. Any push re-enables them. Far longer than the 7-day Supabase
# window, but if the repo goes fully dormant, push a trivial commit to
# re-arm this.

on:
  schedule:
    # 06:00 UTC every Monday and Thursday. Max gap between runs is ~4 days,
    # comfortably under the 7-day pause window.
    - cron: '0 6 * * 1,4'
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write heartbeat + clean old rows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_SERVICE_KEY repo secrets are not set."
            exit 1
          fi

          BASE="${SUPABASE_URL%/}/rest/v1/_keepalive"
          AUTH_H1="apikey: ${SUPABASE_SERVICE_KEY}"
          AUTH_H2="Authorization: Bearer ${SUPABASE_SERVICE_KEY}"

          # ─── Step 1: INSERT one heartbeat row ───────────────────────────
          # Empty JSON object — id and ts use their defaults (gen_random_uuid,
          # now()). The Prefer header tells PostgREST not to return the row
          # body, keeping the response trivial.
          echo "▶ INSERT heartbeat row…"
          insert_status=$(curl -s -o /tmp/insert.txt -w "%{http_code}" --max-time 30 \
            -X POST "$BASE" \
            -H "$AUTH_H1" \
            -H "$AUTH_H2" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}')
          echo "  HTTP $insert_status"
          if [ "$insert_status" -lt 200 ] || [ "$insert_status" -ge 300 ]; then
            echo "::error::Heartbeat INSERT failed with HTTP $insert_status"
            cat /tmp/insert.txt
            exit 1
          fi

          # ─── Step 2: DELETE rows older than 7 days ──────────────────────
          # PostgREST DELETE requires a filter; this is also a real write
          # transaction even when no rows match, so it doubles as activity.
          # The cutoff string is computed in shell (GNU date on Ubuntu).
          cutoff=$(date -u -d '7 days ago' +"%Y-%m-%dT%H:%M:%SZ")
          echo "▶ DELETE rows older than $cutoff…"
          delete_status=$(curl -s -o /tmp/delete.txt -w "%{http_code}" --max-time 30 \
            -X DELETE "${BASE}?ts=lt.${cutoff}" \
            -H "$AUTH_H1" \
            -H "$AUTH_H2" \
            -H "Prefer: return=minimal")
          echo "  HTTP $delete_status"
          if [ "$delete_status" -lt 200 ] || [ "$delete_status" -ge 300 ]; then
            # DELETE failure is logged but not fatal — the INSERT already
            # registered activity, and the table won't grow significantly
            # (one row per scheduled run = ~104 rows/year if cleanup misses).
            echo "::warning::Cleanup DELETE failed with HTTP $delete_status (not fatal — heartbeat already written)"
            cat /tmp/delete.txt
          fi

          echo "✓ Supabase keepalive succeeded — heartbeat written, project activity registered."
