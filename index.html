<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candidacy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Instrument+Serif:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #fff; color: #0f1114; font-family: Geist, ui-sans-serif, system-ui, sans-serif; min-height: 100%; }
    * { box-sizing: border-box; }
    /* Full-bleed site — no card, no padding around the frame */
    .site { width: 100%; }
    .scrn-wrap { width: 100%; }
    .scrn  { transform-origin: top left; }
    /* Mobile renders natively — no scale transform. */
    .scrn-wrap-mobile { width: 100%; max-width: 480px; margin: 0 auto; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="assessment.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="screen-landing.jsx"></script>
  <script type="text/babel" src="screen-onboarding.jsx"></script>
  <script type="text/babel" src="screen-quiz.jsx"></script>
  <script type="text/babel" src="screen-results.jsx"></script>
  <script type="text/babel" src="screen-unlock.jsx"></script>
  <script type="text/babel" src="screen-preview.jsx"></script>
  <script type="text/babel" src="mobile-shared.jsx"></script>
  <script type="text/babel" src="m-screen-landing.jsx"></script>
  <script type="text/babel" src="m-screen-onboarding.jsx"></script>
  <script type="text/babel" src="m-screen-quiz.jsx"></script>
  <script type="text/babel" src="m-screen-results.jsx"></script>
  <script type="text/babel" src="m-screen-unlock.jsx"></script>
  <script type="text/babel" src="m-screen-preview.jsx"></script>
  <!-- Hidden until MVP scope expands (post-purchase paid layers + signed-in dashboard).
       Per 4P docs: launch = Candidacy Scan free diagnostic only.
  <script type="text/babel" src="screen-dashboard.jsx"></script>
  <script type="text/babel" src="screen-evidence.jsx"></script>
  <script type="text/babel" src="screen-analyze.jsx"></script>
  <script type="text/babel" src="screen-discover.jsx"></script>
  -->

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "screen": "landing",
      "theme": "light",
      "accent": "blue",
      "connectorStyle": "curved",
      "serif": "source",
      "density": "regular"
    }/*EDITMODE-END*/;

    const SCREENS = [
      { id: 'landing',    label: 'Landing',           Comp: window.LandingScreen,    MComp: window.MLandingScreen,    signedIn: false },
      { id: 'onboarding', label: 'Onboarding',        Comp: window.OnboardingScreen, MComp: window.MOnboardingScreen, signedIn: false },
      { id: 'quiz',       label: 'Readiness check',   Comp: window.QuizScreen,       MComp: window.MQuizScreen,       signedIn: false },
      { id: 'results',    label: 'Results',           Comp: window.ResultsScreen,    MComp: window.MResultsScreen,    signedIn: false },
      { id: 'unlock',     label: 'Preview-and-Unlock',Comp: window.UnlockScreen,     MComp: window.MUnlockScreen,     signedIn: false },
      { id: 'preview',    label: 'Preview vs Full',   Comp: window.PreviewScreen,    MComp: window.MPreviewScreen,    signedIn: false },
    ];

    const MOBILE_BREAKPOINT = 768;

    const THEME_MAP = { light: window.THEMES.light, warm: window.THEMES.warm, dark: window.THEMES.dark };

    const ACCENTS = {
      blue:   '#3B90F2',
      teal:   '#7BB8B0',
      violet: '#8C7AC8',
      pink:   '#E89BA8',
      yellow: '#E8C66A',
      mint:   '#9DC9A8',
    };

    // Latin serifs first, then "Noto Serif SC" so the browser picks a Chinese
    // serif for Han glyphs (per-glyph fallback). Without this, Chinese in
    // highlighted/italic fragments falls through to the system sans-serif.
    const SERIF_FONTS = {
      source:     '"Source Serif 4", "Source Serif Pro", "Noto Serif SC", Georgia, serif',
      instrument: '"Instrument Serif", "Noto Serif SC", Georgia, serif',
      fraunces:   '"Fraunces", "Noto Serif SC", Georgia, serif',
    };

    function withAccent(theme, accentKey) {
      const c = ACCENTS[accentKey] || theme.brand;
      return { ...theme, brand: c };
    }

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [lang, setLangState] = React.useState(() => {
        try { return localStorage.getItem('candidacy_lang') || 'en'; } catch (e) { return 'en'; }
      });
      const setLang = React.useCallback((next) => {
        setLangState(next);
        try { localStorage.setItem('candidacy_lang', next); } catch (e) {}
      }, []);
      const langCtx = React.useMemo(() => ({ lang, setLang }), [lang, setLang]);

      const screenEntry = SCREENS.find(s => s.id === t.screen) || SCREENS[0];
      const signedIn = screenEntry.signedIn;

      // Track viewport so we can render mobile screens natively at <=768px,
      // and keep the existing scale-to-fit desktop deck above that.
      const [isMobile, setIsMobile] = React.useState(() =>
        typeof window !== 'undefined' && window.innerWidth <= MOBILE_BREAKPOINT
      );
      React.useEffect(() => {
        const onResize = () => setIsMobile(window.innerWidth <= MOBILE_BREAKPOINT);
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);
      const ScreenComp = isMobile && screenEntry.MComp ? screenEntry.MComp : screenEntry.Comp;

      const baseTheme = THEME_MAP[t.theme] || THEME_MAP.light;
      const theme = React.useMemo(() => {
        const themed = withAccent(baseTheme, t.accent);
        return {
          ...themed,
          connectorStyle: t.connectorStyle,
          density: t.density,
          serif: SERIF_FONTS[t.serif] || SERIF_FONTS.source,
        };
      }, [t.theme, t.accent, t.connectorStyle, t.density, t.serif]);

      React.useEffect(() => {
        window.__CANDIDACY_CONNECTOR_STYLE = t.connectorStyle;
      }, [t.connectorStyle]);

      // Responsive scale-to-fit (desktop only — mobile renders natively).
      const FRAME_W = 1280;
      const siteRef = React.useRef(null);
      const scrnRef = React.useRef(null);
      const [scale, setScale] = React.useState(1);

      React.useEffect(() => {
        function fit() {
          const w = siteRef.current;
          if (!w) return;
          if (isMobile) { setScale(1); return; }
          const avail = w.clientWidth;
          setScale(avail / FRAME_W);
        }
        fit();
        window.addEventListener('resize', fit);
        return () => window.removeEventListener('resize', fit);
      }, [isMobile]);

      const [scrnH, setScrnH] = React.useState(1000);
      React.useLayoutEffect(() => {
        if (!scrnRef.current) return;
        setScrnH(scrnRef.current.scrollHeight);
      }, [t.screen, t.theme, t.accent, t.connectorStyle, scale, isMobile]);

      const navCtx = React.useMemo(() => ({
        go: (id) => {
          setTweak('screen', id);
          window.scrollTo({ top: 0, behavior: 'instant' });
        },
        current: t.screen,
        signedIn,
      }), [t.screen, signedIn]);

      React.useEffect(() => {
        document.body.style.background = t.theme === 'dark' ? '#0a0a0c' : t.theme === 'warm' ? '#FAF6EE' : '#FFFFFF';
      }, [t.theme]);

      const idx = SCREENS.findIndex(s => s.id === t.screen);

      return (
        <LangContext.Provider value={langCtx}>
        <AnswersProvider>
        <NavContext.Provider value={navCtx}>
          <div className="site" ref={siteRef}>
            {isMobile ? (
              <div className="scrn-wrap-mobile">
                <ScreenComp theme={theme} key={`m-${t.theme}-${t.accent}-${t.screen}`} />
              </div>
            ) : (
              <div className="scrn-wrap" style={{ height: scrnH * scale }}>
                <div className="scrn"
                  ref={scrnRef}
                  data-screen-label={`${String(idx+1).padStart(2,'0')} ${screenEntry.label}`}
                  style={{
                    width: FRAME_W,
                    transform: `scale(${scale})`,
                  }}>
                  <ScreenComp theme={theme} key={`${t.connectorStyle}-${t.theme}-${t.accent}-${t.screen}`} />
                </div>
              </div>
            )}
          </div>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Screen" />
            <TweakSelect label="View" value={t.screen}
              options={SCREENS.map(s => ({ value: s.id, label: s.label }))}
              onChange={(v) => setTweak('screen', v)} />
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
              <TweakButton onClick={() => {
                const next = SCREENS[(idx - 1 + SCREENS.length) % SCREENS.length].id;
                setTweak('screen', next);
              }}>← Prev</TweakButton>
              <TweakButton onClick={() => {
                const next = SCREENS[(idx + 1) % SCREENS.length].id;
                setTweak('screen', next);
              }}>Next →</TweakButton>
            </div>

            <TweakSection label="Theme" />
            <TweakRadio label="Surface" value={t.theme}
              options={['light', 'warm', 'dark']}
              onChange={(v) => setTweak('theme', v)} />

            <TweakSection label="Accent" />
            <TweakSelect label="Brand colour" value={t.accent}
              options={[
                { value: 'blue', label: 'Blue · default' },
                { value: 'teal', label: 'Teal' },
                { value: 'violet', label: 'Violet' },
                { value: 'pink', label: 'Pink' },
                { value: 'yellow', label: 'Yellow' },
                { value: 'mint', label: 'Mint' },
              ]}
              onChange={(v) => setTweak('accent', v)} />

            <TweakSection label="Mind-map" />
            <TweakRadio label="Connectors" value={t.connectorStyle}
              options={['curved', 'straight', 'orth']}
              onChange={(v) => setTweak('connectorStyle', v)} />

            <TweakSection label="Typography" />
            <TweakSelect label="Serif" value={t.serif}
              options={[
                { value: 'source',     label: 'Source Serif · neutral' },
                { value: 'instrument', label: 'Instrument Serif · editorial' },
                { value: 'fraunces',   label: 'Fraunces · expressive' },
              ]}
              onChange={(v) => setTweak('serif', v)} />
          </TweaksPanel>
        </NavContext.Provider>
        </AnswersProvider>
        </LangContext.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
