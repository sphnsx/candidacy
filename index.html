<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTV Insight MVP</title>
    <meta name="description" content="UK Global Talent Visa (Arts & Culture) readiness check MVP" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #162033;
      }
      button, input, select, textarea {
        font: inherit;
      }
      .app {
        min-height: 100vh;
      }
      .container {
        width: min(1040px, calc(100vw - 32px));
        margin: 0 auto;
      }
      .hero {
        padding: 80px 0 56px;
        background: linear-gradient(180deg, #eef4ff 0%, #f8fbff 100%);
        border-bottom: 1px solid #e5ebf5;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 32px;
        align-items: start;
      }
      .eyebrow {
        display: inline-flex;
        padding: 8px 12px;
        border-radius: 999px;
        background: #e6efff;
        color: #2756c5;
        font-size: 14px;
        font-weight: 600;
      }
      h1 {
        margin: 20px 0 16px;
        font-size: clamp(30px, 4.8vw, 48px);
        line-height: 1.22;
        letter-spacing: -0.02em;
      }
      .hero p {
        margin: 0 0 20px;
        font-size: 18px;
        line-height: 1.7;
        color: #44506a;
      }
      .cta-row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .btn {
        border: 0;
        border-radius: 14px;
        padding: 14px 20px;
        cursor: pointer;
        transition: background-color .15s ease, border-color .15s ease, color .15s ease;
      }
      .btn-primary {
        background: #1c4ed8;
        color: white;
        font-weight: 700;
      }
      .btn-primary:hover { background: #1e40af; }
      .btn-secondary {
        background: transparent;
        color: #162033;
        border: 1px solid #cfdaf1;
      }
      .btn-secondary:hover {
        border-color: #2756c5;
        color: #2756c5;
      }
      .hero-note {
        margin-top: 16px;
        font-size: 14px;
        color: #66728a;
      }
      .trust-points {
        display: grid;
        gap: 10px;
        margin-top: 20px;
      }
      .trust-point {
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(255,255,255,0.72);
        border: 1px solid #e2ebfb;
        color: #44506a;
        line-height: 1.6;
      }
      .entry-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
        margin-top: 24px;
      }
      .entry-card {
        padding: 24px;
        border-radius: 16px;
        background: white;
        border: 1px solid #e4eaf4;
        cursor: pointer;
      }
      .entry-card:hover {
        border-color: #bfd0ef;
      }
      .entry-card h3 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      .entry-card p {
        margin: 0;
        color: #55627d;
        line-height: 1.7;
      }
      .field-stack {
        display: grid;
        gap: 12px;
      }
      .field-stack input, .field-stack select, .field-stack textarea {
        width: 100%;
        border: 1px solid #d6e0ef;
        border-radius: 12px;
        padding: 14px 16px;
        background: white;
      }
      .field-stack textarea {
        min-height: 120px;
        resize: vertical;
      }
      .field-stack input:focus, .field-stack select:focus, .field-stack textarea:focus {
        outline: none;
        border-color: #1c4ed8;
        box-shadow: 0 0 0 3px rgba(28, 78, 216, 0.08);
      }
      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        padding: 6px 10px;
        border-radius: 999px;
        background: #e6efff;
        border: 1px solid #cfe0ff;
        font-size: 12px;
        color: #2756c5;
      }
      .tracker-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 0;
        border-bottom: 1px solid #e9edf5;
      }
      .tracker-row-title {
        font-weight: 700;
        margin-bottom: 6px;
      }
      .lead-panel-note {
        margin-top: 12px;
        padding: 14px 16px;
        border-radius: 12px;
        background: #f8fbff;
        border: 1px solid #e2ebfb;
      }
      .panel {
        background: white;
        border: 1px solid #e4eaf4;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 6px 18px rgba(15, 32, 63, 0.05);
      }
      .score-preview {
        display: grid;
        gap: 14px;
      }
      .mini-card {
        background: #f8fbff;
        border: 1px solid #e2ebfb;
        border-radius: 12px;
        padding: 18px;
      }
      .mini-card strong {
        display: block;
        font-size: 24px;
        margin-top: 4px;
      }
      .section {
        padding: 72px 0;
      }
      .section h2 {
        margin: 0 0 10px;
        font-size: 28px;
        line-height: 1.35;
      }
      .section-sub {
        margin: 0 0 28px;
        color: #55627d;
        line-height: 1.7;
      }
      .grid-3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }
      .card {
        background: white;
        border: 1px solid #e5ebf5;
        border-radius: 12px;
        padding: 24px;
      }
      .card h3 { margin-top: 0; font-size: 20px; }
      .card p { margin-bottom: 0; color: #57637c; line-height: 1.7; }
      .quiz-wrap {
        padding: 24px 0 72px;
      }
      .sticky-topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(245, 247, 251, 0.92);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid #e5ebf5;
        margin-bottom: 18px;
      }
      .sticky-topbar-inner {
        width: min(1080px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 12px 0;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .progress {
        height: 10px;
        background: #e8eef8;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 18px;
      }
      .progress > div {
        height: 100%;
        background: #1c4ed8;
        transition: width .3s ease;
      }
      .question-meta {
        color: #62708b;
        font-size: 14px;
        margin-bottom: 8px;
      }
      .question-title {
        font-size: 30px;
        line-height: 1.25;
        margin: 0 0 10px;
      }
      .question-desc {
        margin: 0 0 22px;
        color: #59657d;
        line-height: 1.7;
      }
      .options {
        display: grid;
        gap: 12px;
      }
      .option {
        padding: 16px 18px;
        border-radius: 12px;
        border: 1px solid #dbe4f3;
        background: white;
        cursor: pointer;
        min-height: 52px;
        text-align: left;
        color: #162033;
      }
      .option:hover {
        border-color: #bfd0ef;
      }
      .option.selected {
        border-color: #1c4ed8;
        background: #e6efff;
        box-shadow: inset 0 0 0 1px #1c4ed8;
      }
      .option small {
        display: block;
        margin-top: 6px;
        color: #6a7690;
      }
      .nav-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 28px;
      }
      .result-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .result-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 18px 0 22px;
      }
      .result-score {
        font-size: 68px;
        font-weight: 800;
        line-height: 1;
      }
      .badge {
        display: inline-flex;
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
      }
      .badge-low { background: #feeceb; color: #d92d2d; }
      .badge-mid { background: #fff3e0; color: #e8853d; }
      .badge-high { background: #e6f9ee; color: #22a06b; }
      .metric-list, .hint-list, .next-list {
        display: grid;
        gap: 12px;
      }
      .metric {
        padding: 16px 18px;
        border-radius: 12px;
        background: #f8fbff;
        border: 1px solid #e2ebfb;
      }
      .metric-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .lead-form {
        display: grid;
        gap: 12px;
      }
      .lead-toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .lead-list {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }
      .lead-item {
        padding: 14px 16px;
        border-radius: 16px;
        background: #f8fbff;
        border: 1px solid #e2ebfb;
      }
      .lead-item strong {
        display: block;
        margin-bottom: 4px;
      }
      .lead-form input {
        width: 100%;
        border: 1px solid #d6e0ef;
        border-radius: 12px;
        padding: 14px 16px;
        background: white;
      }
      .lead-form input:focus {
        outline: none;
        border-color: #1c4ed8;
        box-shadow: 0 0 0 3px rgba(28, 78, 216, 0.08);
      }
      .muted {
        color: #6b7790;
        font-size: 14px;
        line-height: 1.6;
      }
      .status-ok {
        color: #22a06b;
        font-size: 14px;
        line-height: 1.6;
      }
      .status-error {
        color: #d92d2d;
        font-size: 14px;
        line-height: 1.6;
      }
      @media (max-width: 860px) {
        .hero {
          padding: 56px 0 40px;
        }
        .hero-grid, .grid-3, .result-grid, .entry-grid { grid-template-columns: 1fr; }
        .sticky-topbar-inner {
          width: min(1040px, calc(100vw - 24px));
        }
        .container {
          width: min(1040px, calc(100vw - 24px));
        }
        .question-title {
          font-size: 24px;
          line-height: 1.4;
        }
        .panel {
          padding: 20px;
        }
        .result-score {
          font-size: 56px;
        }
        .btn {
          width: 100%;
          justify-content: center;
        }
        .cta-row {
          display: grid;
          grid-template-columns: 1fr;
        }
        .nav-row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const FIELD_EVIDENCE_OPTIONS = {
        '视觉艺术': ['个展 / 群展', '美术馆 / 机构展出', '驻留项目', '委约创作', '作品被收藏 / 收录', '媒体评论 / 专访', '艺术奖项 / 提名', '公开发表作品 / 画册 / 专题收录'],
        '设计': ['设计展 / 设计周展出', '品牌 / 机构委约项目', '已落地的设计作品', '专业媒体报道 / 专访', '设计奖项 / 入围', '出版 / 专题收录', '机构合作项目'],
        '时装': ['时装发布 / runway presentation', '品牌系列 / 联名 / 委约', 'showroom / 展陈 / trade presentation', '时尚媒体报道 / 专访', '时装奖项 / 入围', '机构合作项目 / 委约项目', '公开发表作品 / lookbook / 专题收录'],
        '影视': ['影片入围 / 放映', '电影节 / 官方单元 / 策展放映', '导演 / 编剧 / 制片 / 主创署名作品', '平台播出 / 发行', '专业媒体报道 / 评论', '影视奖项 / 提名', '机构支持 / 委约项目'],
        '建筑': ['建成项目 / 落地项目', '建筑展 / 双年展 / 机构展出', '竞赛获奖 / 入围', '专业出版 / 专题收录', '媒体报道 / 评论', '机构委约 / 合作项目', '研究 / 策展 / 公共项目成果'],
        '表演艺术': ['正式演出 / 巡演', '音乐节 / 戏剧节 / 艺术节呈现', '主创 / 表演 / 编导署名作品', '机构委约 / 驻留 / 合作项目', '专业媒体报道 / 评论', '表演艺术奖项 / 提名', '录音 / 影像 / 出版成果'],
        '其他 Arts & Culture 相关领域': ['机构合作项目', '公开发表成果', '专业媒体报道 / 评论', '奖项 / 提名 / 荣誉', '驻留 / 委约 / 公共项目', '出版 / 专题收录']
      };

      function getEvidenceOptionsByFields(selectedFields) {
        const fields = Array.isArray(selectedFields) ? selectedFields : [];
        const merged = fields.flatMap((field) => FIELD_EVIDENCE_OPTIONS[field] || []);
        const deduped = [...new Set(merged)];
        if (!deduped.length) {
          return ['展览 / 群展 / 个展', '演出 / 放映 / 节目呈现', '出版 / 发表 / 专题收录', '媒体报道 / 评论 / 专访', '奖项 / 提名 / 荣誉', '驻留 / 委约 / 机构合作项目', '公开发表的作品 / 项目 / 策展 / 创作成果', '我还不确定哪些算有效证明材料'];
        }
        return [...deduped, '我还不确定哪些算有效证明材料'];
      }

      const QUESTIONS = [
        {
          id: 'fields',
          type: 'multi',
          title: '你目前主要从事哪些领域？',
          desc: '如果你的实践跨多个领域，请选择最能代表你近几年主要工作的 1 至 3 个方向。',
          maxSelect: 3,
          options: ['视觉艺术', '设计', '时装', '影视', '建筑', '表演艺术', '其他 Arts & Culture 相关领域']
        },
        {
          id: 'years',
          type: 'single',
          title: '你在这些领域持续工作了多久？',
          options: ['少于 3 年', '3–5 年', '5–8 年', '8–12 年', '12 年以上']
        },
        {
          id: 'stage',
          type: 'single',
          title: '你目前考虑申请 UK Global Talent Visa (Arts & Culture) 的状态更接近哪一种？',
          options: ['我只是刚开始了解', '我已经认真看过官方要求', '我已经开始整理材料', '我已经有比较明确的申请计划', '我原本准备申请，但现在卡住了']
        },
        {
          id: 'evidenceTypes',
          type: 'multi',
          title: '你目前已经具备哪些较明确、且更接近你所选方向的证明材料类型？',
          getOptions: (answers) => getEvidenceOptionsByFields(answers.fields)
        },
        {
          id: 'recency',
          type: 'single',
          title: '你目前最重要的证明材料，主要集中在哪个时间范围内？',
          options: ['大多发生在最近 1–2 年', '大多发生在最近 3–5 年', '分布在 5 年内外，但 5 年内仍有一部分', '大多早于 5 年前', '我不确定']
        },
        {
          id: 'sourceNature',
          type: 'single',
          title: '你目前最重要的证明材料，主要来自哪一类实践？',
          options: ['主要来自毕业后的 Arts & Culture 专业实践', '大多来自毕业后的 Arts & Culture 专业实践，但夹杂少量学生或商业项目', 'Arts & Culture 专业实践、学生项目、商业项目都有', '大多来自商业项目', '大多来自学生时期项目']
        },
        {
          id: 'evidenceStrength',
          type: 'single',
          title: '这些证明材料的整体情况更接近哪一种？',
          options: ['有一些经历，但大多较弱、零散，或者难以支持申请', '有少量较强证明材料，但整体还不够稳', '已经有几项相对明确、可验证的证明材料', '证明材料基础较完整，类型和质量都还不错', '我不确定']
        },
        {
          id: 'verifiability',
          type: 'single',
          title: '这些证明材料中，有多少可以被外部验证？',
          options: ['很少可以验证', '有一部分可以验证', '大部分可以验证', '几乎都可以验证']
        },
        {
          id: 'recommenderCount',
          type: 'single',
          title: '你现在大概能想到几位可能愿意为你写 recommendation letters 的人？',
          options: ['0 位', '1 位', '2 位', '3 位', '4 位或以上']
        },
        {
          id: 'recommenderQuality',
          type: 'multi',
          title: '这些潜在推荐人目前更接近哪种情况？',
          desc: '可多选。可选数量会根据上一题你填写的推荐人数自动变化。若你目前还拿不准，请只选“我不确定他们是否符合要求”。',
          exclusiveOption: '我不确定他们是否符合要求',
          options: ['和我有真实合作经历', '来自不同机构', '在行业内有一定分量或认可度', '我有把握他们能写出具体内容', '我不确定他们是否符合要求']
        },
        {
          id: 'lettersConfidence',
          type: 'single',
          title: '如果现在就开始联系，你觉得自己拿到 3 封有实质内容的 recommendation letters 的把握有多大？',
          options: ['很低', '比较低', '一般', '比较高', '很高']
        },
        {
          id: 'narrative',
          type: 'single',
          title: '你现在是否能比较清楚地说明：你的 Arts & Culture 实践是什么，以及你为什么适合在英国继续发展？',
          options: ['现在还说不清', '有一些想法，但比较模糊', '大致能说清', '说得比较清楚', '说得很清楚']
        },
        {
          id: 'selfReadiness',
          type: 'single',
          title: '如果现在要做整体判断，你觉得自己离正式提交申请更接近哪一种状态？',
          options: ['还差很远', '有一些基础，但差距明显', '可以开始认真准备', '已经接近可申请', '我不确定']
        }
      ];

      const SCORE_MAPS = {
        years: { '少于 3 年': 1, '3–5 年': 2, '5–8 年': 3, '8–12 年': 4, '12 年以上': 5 },
        stage: { '我只是刚开始了解': 1, '我已经认真看过官方要求': 2, '我已经开始整理材料': 3, '我已经有比较明确的申请计划': 4, '我原本准备申请，但现在卡住了': 4 },
        recency: { '大多发生在最近 1–2 年': 10, '大多发生在最近 3–5 年': 9, '分布在 5 年内外，但 5 年内仍有一部分': 5, '大多早于 5 年前': 1, '我不确定': 2 },
        sourceNature: { '主要来自毕业后的艺术 / 文化专业实践': 15, '大多来自毕业后的艺术 / 文化专业实践，但夹杂少量学生或商业项目': 11, '艺术 / 文化专业实践、学生项目、商业项目都有': 6, '大多来自商业项目': 1, '大多来自学生时期项目': 0 },
        evidenceStrength: { '有一些经历，但大多较弱、零散，或者难以支持申请': 2, '有少量较强证明材料，但整体还不够稳': 5, '已经有几项相对明确、可验证的证明材料': 8, '证明材料基础较完整，类型和质量都还不错': 10, '我不确定': 3 },
        verifiability: { '很少可以验证': 1, '有一部分可以验证': 2, '大部分可以验证': 4, '几乎都可以验证': 5 },
        recommenderCount: { '0 位': 0, '1 位': 2, '2 位': 5, '3 位': 8, '4 位或以上': 10 },
        lettersConfidence: { '很低': 1, '比较低': 2, '一般': 3, '比较高': 4, '很高': 5 },
        narrative: { '现在还说不清': 1, '有一些想法，但比较模糊': 3, '大致能说清': 6, '说得比较清楚': 8, '说得很清楚': 10 },
        selfReadiness: { '还差很远': 1, '有一些基础，但差距明显': 2, '可以开始认真准备': 4, '已经接近可申请': 5, '我不确定': 2 },
      };

      function evidenceTypeScore(selected) {
        const clean = (selected || []).filter(v => v !== '我还不确定哪些算有效证明材料');
        const n = clean.length;
        if (n <= 0) return 0;
        if (n === 1) return 3;
        if (n === 2) return 7;
        if (n === 3) return 9;
        return 10;
      }

      function recommenderQualityScore(count, selected) {
        const set = new Set(selected || []);
        if (!count || count === '0 位') return 0;
        if (set.has('我不确定他们是否符合要求')) return count === '1 位' ? 1 : 0;

        let raw = 0;
        if (set.has('和我有真实合作经历')) raw += 3;
        if (set.has('来自不同机构')) raw += 2;
        if (set.has('在行业内有一定分量或认可度')) raw += 3;
        if (set.has('我有把握他们能写出具体内容')) raw += 2;

        const capMap = {
          '1 位': 3,
          '2 位': 6,
          '3 位': 8,
          '4 位或以上': 10,
        };
        const cap = capMap[count] || 0;
        return Math.min(raw, cap);
      }

      function calculateResult(answers) {
        const selectedFields = Array.isArray(answers.fields) && answers.fields.length ? answers.fields : ['其他 Arts & Culture 相关领域'];

          let evidence = 0;
          evidence += evidenceTypeScore(answers.evidenceTypes);
          evidence += SCORE_MAPS.recency[answers.recency] || 0;
          evidence += SCORE_MAPS.sourceNature[answers.sourceNature] || 0;
          evidence += SCORE_MAPS.evidenceStrength[answers.evidenceStrength] || 0;
          evidence += SCORE_MAPS.verifiability[answers.verifiability] || 0;

          let recommenders = 0;
          recommenders += SCORE_MAPS.recommenderCount[answers.recommenderCount] || 0;
          recommenders += recommenderQualityScore(answers.recommenderCount, answers.recommenderQuality);
          recommenders += SCORE_MAPS.lettersConfidence[answers.lettersConfidence] || 0;

          let readiness = 0;
          readiness += SCORE_MAPS.years[answers.years] || 0;
          readiness += SCORE_MAPS.stage[answers.stage] || 0;
          readiness += SCORE_MAPS.narrative[answers.narrative] || 0;
          readiness += SCORE_MAPS.selfReadiness[answers.selfReadiness] || 0;

          let total = evidence + recommenders + readiness;
          const hints = [];

          const evidenceTypes = (answers.evidenceTypes || []).filter(v => v !== '我还不确定哪些算有效证明材料');
          if (evidenceTypes.length < 2) {
            evidence = Math.min(evidence, 28);
            hints.push(getFieldSpecificHint(field, 'weakEvidence'));
          }
          if (answers.recency === '大多早于 5 年前') {
            total -= 5;
            hints.push(getFieldSpecificHint(field, 'oldEvidence'));
          }
          if (answers.sourceNature === '大多来自学生时期项目') {
            evidence = Math.min(evidence, 22);
            total -= 8;
            hints.push(getFieldSpecificHint(field, 'studentProject'));
          }
          if (answers.sourceNature === '大多来自商业项目') {
            evidence = Math.min(evidence, 22);
            total -= 8;
            hints.push(getFieldSpecificHint(field, 'commercialProject'));
          }
          if (answers.recommenderCount === '0 位' || answers.recommenderCount === '1 位') {
            const uncertainOnly = Array.isArray(answers.recommenderQuality)
              && answers.recommenderQuality.length === 1
              && answers.recommenderQuality[0] === '我不确定他们是否符合要求';
            recommenders = Math.min(recommenders, answers.recommenderCount === '0 位' ? 2 : (uncertainOnly ? 3 : 5));
            hints.push(getFieldSpecificHint(field, 'weakLetters'));
          }
          if (answers.recommenderCount === '2 位') {
            recommenders = Math.min(recommenders, 9);
          }
          if (answers.narrative === '现在还说不清' || answers.narrative === '有一些想法，但比较模糊') {
            hints.push(getFieldSpecificHint(field, 'weakNarrative'));
          }

          total = Math.max(0, Math.min(100, evidence + recommenders + readiness + (total - (evidence + recommenders + readiness))));

          let band = 'low';
          let summary = '你目前还不适合按这个 route 进入正式申请准备。';
          let nextSteps = getFieldSpecificNextSteps([field], 'low');
          if (total >= 40 && total <= 69) {
            band = 'mid';
            summary = '按这个 route 看，你已经有一定基础，但距离稳定申请还差一段。';
            nextSteps = getFieldSpecificNextSteps([field], 'mid');
          }
          if (total >= 70) {
            band = 'high';
            summary = '按这个 route 看，你已经具备一定申请基础。';
            nextSteps = getFieldSpecificNextSteps([field], 'high');
          }

          return {
            field,
            label: getRouteLabel(field),
            total,
            band,
            summary,
            metrics: {
              '证明材料强度': evidence,
              '推荐信网络': recommenders,
              '整体准备状态': readiness,
            },
            hints: hints.slice(0, 3),
            nextSteps,
          };
        }

        const routeResults = selectedFields.map(calculateRouteResult).sort((a, b) => b.total - a.total);
        const primaryRecommendation = routeResults[0];
        const alternateRoutes = routeResults.slice(1);

        return {
          total: primaryRecommendation.total,
          band: primaryRecommendation.band,
          summary: `如果按 ${primaryRecommendation.label} route 组织申请，你目前的准备度最高。`,
          metrics: primaryRecommendation.metrics,
          hints: primaryRecommendation.hints,
          nextSteps: primaryRecommendation.nextSteps,
          primaryRecommendation,
          alternateRoutes,
          routeResults,
        };
      }

          const current = answers[id] || [];

                  <h3 style={{marginTop:0}}>如果先按 {result.primaryRecommendation.label} route 推进，你现在更应该做什么</h3>
                  <div className="next-list">
                    {result.primaryRecommendation.nextSteps.map((item, idx) => <div className="metric" key={idx}>{item}</div>)}
                  </div>
                </div>

                <div className="panel">
                  <h3 style={{marginTop:0}}>保存你的结果</h3>
                  <p className="section-sub" style={{marginBottom:14}}>如果你希望先留住这次判断结果，可以先输入邮箱保存。当前 demo 版本会把结果保存在本地浏览器，用于演示留资与后续跟进流程。</p>
                  <div className="lead-panel-note" style={{marginBottom:14}}>
                    <div style={{fontWeight:700, marginBottom:6}}>有任何问题？</div>
                    <div className="muted">
                      欢迎邮件咨询 <a href="mailto:gtvinsight@gmail.com?subject=GTV%20Insight%20Consultation" style={{color:'#2d5bff', textDecoration:'none', fontWeight:600}}>gtvinsight@gmail.com</a>
                    </div>
                  </div>
                  <form className="lead-form" onSubmit={saveLeadPlaceholder}>
                    <input type="email" name="email" required placeholder="输入你的邮箱" value={email} onChange={(e) => setEmail(e.target.value)} />
                    <button type="submit" className="btn btn-primary" disabled={leadSaving} style={{opacity: leadSaving ? 0.7 : 1}}>{leadSaving ? '保存中...' : '保存结果'}</button>
                    {leadSaved && <div className="status-ok">结果已保存在当前浏览器。本版本暂不发送邮件，用于演示流程。</div>}
                    {leadError && <div className="status-error">{leadError}</div>}
                    <div className="muted">说明：当前版本会先保存邮箱、答题结果、评分和关键提示到本地浏览器，不会发送到邮箱。</div>
                  </form>
                  <div className="lead-panel-note">
                    <div style={{fontWeight:700, marginBottom:6}}>当前保存的内容</div>
                    <div className="muted">邮箱、答题结果、总分、关键提示会一起保留，方便后续判断这是不是值得继续推进的线索。</div>
                  </div>
                  <div className="lead-toolbar">
                    <button type="button" className="btn btn-secondary" onClick={refreshSavedLeads}>刷新已保存线索</button>
                    <button type="button" className="btn btn-secondary" onClick={exportSavedLeads} disabled={!savedLeads.length} style={{opacity: savedLeads.length ? 1 : 0.5}}>导出 JSON</button>
                    <button type="button" className="btn btn-secondary" onClick={clearSavedLeads} disabled={!savedLeads.length} style={{opacity: savedLeads.length ? 1 : 0.5}}>清空本地线索</button>
                  </div>
                  <div className="lead-list">
                    <div className="muted">当前浏览器已保存 {savedLeads.length} 条线索</div>
                    {savedLeads.slice(0, 5).map((lead, idx) => (
                      <div className="lead-item" key={`${lead.email}-${lead.createdAt}-${idx}`}>
                        <strong>{lead.email}</strong>
                        <div className="muted">评分：{lead?.result?.total ?? '-'}，状态：{lead?.result?.summary ?? '-'}</div>
                        <div className="muted">保存时间：{lead.createdAt ? new Date(lead.createdAt).toLocaleString() : '-'}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
