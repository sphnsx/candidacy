<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTV Insight</title>
    <meta name="description" content="UK Global Talent Visa (Arts & Culture) readiness check" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        --bg: #FFFFFF;
        --surface: #F5F6F8;
        --ink: #0F1114;
        --ink-muted: #5A5E66;
        --ink-faint: #A0A4AB;
        --hairline: #0F1114;
        --hairline-faint: rgba(15,17,20,0.10);
        --connector: rgba(15,17,20,0.20);
        --brand: #3B90F2;
        --brand-soft: rgba(59,144,242,0.06);
        --brand-ring: rgba(59,144,242,0.14);
        --pink: #D99DCF; --tan: #E5B487; --teal: #9BD3CE; --violet: #B4A9E7;
        --yellow: #F3D24A; --mint: #A8DDB4; --lilac: #C58DD2; --mauve: #B68994; --sky: #A7CFF5;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        background: var(--bg); color: var(--ink);
        font-family: Geist, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 15px; line-height: 1.55; letter-spacing: -0.005em;
        -webkit-font-smoothing: antialiased;
      }
      button, input, select, textarea { font: inherit; color: inherit; }
      a { color: var(--brand); text-decoration: none; }

      .frame { width: 100%; max-width: 1280px; margin: 0 auto; background: var(--bg); }

      .topnav {
        display: flex; align-items: center; gap: 12px;
        padding: 18px 56px;
        border-bottom: 1px solid var(--hairline-faint);
        background: var(--bg);
        position: sticky; top: 0; z-index: 30;
        backdrop-filter: blur(8px);
      }
      .brand-mark { display: flex; align-items: center; gap: 10px; margin-right: 30px; cursor: pointer; }
      .brand-mark .name { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; color: var(--ink); }
      .topnav nav { display: flex; gap: 26px; flex: 1; flex-wrap: wrap; }
      .nav-item {
        display: inline-flex; align-items: center; gap: 8px;
        font-size: 14.5px; font-weight: 500; letter-spacing: -0.01em;
        color: var(--ink-muted); cursor: pointer;
        padding-bottom: 2px;
        border: 0; border-bottom: 1.5px solid transparent;
        background: none;
      }
      .nav-item.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--brand); }
      .lang-toggle {
        display: inline-flex; border: 1px solid var(--hairline-faint); border-radius: 999px;
        padding: 3px; background: var(--bg);
      }
      .lang-toggle button {
        appearance: none; border: 0; background: transparent;
        padding: 5px 12px; border-radius: 999px;
        font-size: 12.5px; font-weight: 600; letter-spacing: -0.005em;
        color: var(--ink-muted); cursor: pointer;
      }
      .lang-toggle button.active { background: var(--ink); color: var(--bg); }

      .bullet { display: inline-block; border-radius: 50%; flex-shrink: 0; vertical-align: middle; }
      .eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; letter-spacing: 0.03em; color: var(--ink-muted); text-transform: uppercase; }
      .ucase { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted); }
      .rule { height: 0; border-top: 1px solid var(--hairline-faint); }

      .btn {
        appearance: none; border-radius: 999px;
        font-weight: 600; font-size: 14.5px; letter-spacing: -0.01em;
        padding: 12px 22px; cursor: pointer;
        transition: opacity .15s, background-color .15s, border-color .15s;
        border: 1px solid var(--hairline);
        background: transparent; color: var(--ink);
      }
      .btn:hover { opacity: 0.85; }
      .btn-primary { background: var(--brand); border-color: var(--brand); color: white; }
      .btn-sm { padding: 9px 16px; font-size: 13.5px; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }

      h1, h2, h3 { margin: 0; color: var(--ink); font-weight: 600; }
      .h-hero { font-size: clamp(40px, 5vw, 64px); line-height: 1.02; letter-spacing: -0.035em; text-wrap: balance; }
      .h-section { font-size: 36px; line-height: 1.05; letter-spacing: -0.028em; }
      .h-quiz { font-size: 36px; line-height: 1.15; letter-spacing: -0.028em; text-wrap: balance; }
      .h-result { font-size: 48px; line-height: 1.08; letter-spacing: -0.03em; text-wrap: balance; }
      .muted { color: var(--ink-muted); }
      .faint { color: var(--ink-faint); }

      .card { background: var(--bg); border: 1px solid var(--hairline-faint); border-radius: 16px; padding: 26px; }
      .surface { background: var(--surface); }

      .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--bg); border: 1px solid var(--hairline-faint); font-size: 12.5px; font-weight: 500; color: var(--ink); }
      .chip .bullet { width: 8px; height: 8px; }

      .hero { padding: 72px 56px 48px; text-align: center; }
      .hero p.lede { font-size: 18px; color: var(--ink-muted); max-width: 640px; margin: 0 auto 32px; line-height: 1.55; text-wrap: pretty; }
      .hero .cta-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      .hero h1 { margin: 0 auto 22px; max-width: 960px; }
      .hero h1 .accent { color: var(--brand); }

      .mindmap-wrap { padding: 20px 56px 60px; }
      .mindmap { position: relative; width: 100%; max-width: 1168px; height: 660px; margin: 0 auto; }
      .mm-svg { position: absolute; inset: 0; pointer-events: none; }
      .mm-hub { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .mm-hub .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 8px var(--brand-ring); }
      .mm-hub .label { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; color: var(--ink); max-width: 220px; text-align: center; line-height: 1.2; }
      .mm-node { position: absolute; display: flex; align-items: center; gap: 10px; transform: translateY(-50%); white-space: nowrap; }
      .mm-node.end { flex-direction: row-reverse; transform: translate(-100%, -50%); text-align: right; }
      .mm-node .bullet { width: 14px; height: 14px; }
      .mm-node .l-title { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; color: var(--ink); line-height: 1.3; }
      .mm-node .l-sub { font-size: 12.5px; color: var(--ink-muted); margin-top: 2px; line-height: 1.4; }
      .hub-caption { position: absolute; transform: translateX(-50%); font-size: 13px; color: var(--ink-muted); font-weight: 500; }

      .threeways { padding: 60px 56px 72px; background: var(--surface); }
      .threeways .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 36px; gap: 20px; flex-wrap: wrap; }
      .threeways .head p { font-size: 15px; color: var(--ink-muted); max-width: 520px; margin: 12px 0 0; }
      .ways-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
      .way-card { background: var(--bg); border: 1px solid var(--hairline-faint); border-radius: 16px; padding: 26px 26px 24px; cursor: pointer; transition: transform .15s, border-color .15s; }
      .way-card:hover { transform: translateY(-2px); border-color: rgba(15,17,20,0.18); }
      .way-card .head-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
      .way-card .num { font-weight: 500; font-size: 12.5px; letter-spacing: 0.03em; color: var(--ink-muted); }
      .way-card h3 { font-size: 22px; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 12px; }
      .way-card p { color: var(--ink-muted); font-size: 14.5px; margin: 0 0 22px; line-height: 1.55; }
      .way-card .cta { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; color: var(--ink); }
      .way-card .cta .arr { color: var(--brand); }

      .isnot { padding: 72px 56px 56px; }
      .isnot-grid { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 56px; }
      .isnot-grid p { font-size: 15.5px; color: var(--ink-muted); margin: 16px 0 0; max-width: 400px; line-height: 1.6; }
      .isnot-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
      .col-head { margin: 0 0 18px; }
      .col-head.brand { color: var(--brand); }

      .bullet-list { display: grid; gap: 18px; }
      .bullet-item { display: flex; align-items: flex-start; gap: 12px; }
      .bullet-item > .bullet { width: 12px; height: 12px; margin-top: 7px; }
      .bullet-item .text { font-weight: 600; font-size: 16px; letter-spacing: -0.01em; line-height: 1.3; color: var(--ink); }
      .bullet-item .sub { font-size: 13.5px; font-weight: 400; color: var(--ink-muted); margin-top: 3px; line-height: 1.5; }

      .footer { padding: 36px 56px 44px; border-top: 1px solid var(--hairline-faint); display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 40px; font-size: 13px; color: var(--ink-muted); }
      .footer .col-title { font-weight: 600; color: var(--ink); margin-bottom: 10px; }
      .footer ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
      .footer p { margin: 0; max-width: 460px; line-height: 1.6; }

      .progress-bar { flex: 1; height: 3px; background: var(--hairline-faint); position: relative; border-radius: 2px; }
      .progress-bar > div { position: absolute; inset: 0; right: auto; background: var(--brand); border-radius: 2px; transition: width 0.25s ease; }
      .progress-row { padding: 20px 56px; border-bottom: 1px solid var(--hairline-faint); display: flex; align-items: center; gap: 28px; }

      .quiz-grid { display: grid; grid-template-columns: 1fr 380px; min-height: 760px; }
      .quiz-main { padding: 52px 56px; border-right: 1px solid var(--hairline-faint); }
      .quiz-side { padding: 48px 32px; background: var(--surface); }

      .options { display: grid; gap: 8px; margin-top: 28px; }
      .option { display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--hairline-faint); background: var(--bg); cursor: pointer; text-align: left; transition: all 0.15s ease; width: 100%; }
      .option:hover { border-color: rgba(15,17,20,0.18); }
      .option.selected { border-color: var(--brand); background: var(--brand-soft); }
      .option .bullet { width: 14px; height: 14px; }
      .option .label-text { flex: 1; font-size: 16px; font-weight: 500; color: var(--ink); letter-spacing: -0.005em; }
      .option small { display: block; margin-top: 4px; color: var(--ink-faint); font-weight: 400; font-size: 12.5px; }
      .option .selected-tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; font-size: 12px; color: var(--brand); }
      .option .selected-tag .bullet { width: 7px; height: 7px; background: var(--brand); }

      .nav-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; }

      .score-circle { width: 180px; height: 180px; border-radius: 50%; background: var(--bg); border: 2px solid var(--brand); display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 0 10px rgba(59,144,242,0.08); }
      .score-circle .num { font-size: 72px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; color: var(--ink); }
      .score-circle .lbl { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }

      .axis-pill { display: inline-flex; align-items: center; gap: 12px; background: var(--bg); padding: 8px 14px; border: 1px solid var(--hairline-faint); border-radius: 999px; }
      .axis-pill .bullet { width: 12px; height: 12px; }
      .axis-pill .name { font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
      .axis-pill .sc { font-size: 13px; color: var(--ink-muted); }

      .step-list { display: grid; gap: 22px; }
      .step-item { display: grid; grid-template-columns: 20px 1fr; gap: 16px; }
      .step-item .bullet { width: 14px; height: 14px; margin-top: 6px; }
      .step-item .num { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--ink-muted); margin-bottom: 4px; }
      .step-item .title { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; color: var(--ink); line-height: 1.2; }
      .step-item .body { font-size: 14px; color: var(--ink-muted); line-height: 1.55; }

      .sidemap { position: relative; height: 260px; margin-bottom: 8px; }
      .sidemap .hub { position: absolute; left: 40px; top: 130px; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 8px var(--brand-ring); }
      .sidemap .leaf { position: absolute; left: 180px; transform: translateY(-50%); display: flex; align-items: center; gap: 10px; }
      .sidemap .leaf .bullet { width: 12px; height: 12px; }
      .sidemap .leaf .name { font-size: 13.5px; font-weight: 600; color: var(--ink); letter-spacing: -0.005em; line-height: 1.2; }
      .sidemap .leaf .stage { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }
      .sidemap .leaf.todo .name { color: var(--ink-faint); }

      .mbars { display: grid; gap: 14px; }
      .mbar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
      .mbar-head .left { display: flex; align-items: center; gap: 8px; }
      .mbar-head .left .bullet { width: 9px; height: 9px; }
      .mbar-head .name { font-weight: 500; font-size: 13.5px; color: var(--ink); letter-spacing: -0.005em; }
      .mbar-head .v { font-size: 12.5px; color: var(--ink-muted); }
      .mbar-head .v strong { color: var(--ink); font-weight: 600; }
      .mbar-track { height: 3px; background: var(--hairline-faint); border-radius: 2px; position: relative; }
      .mbar-track > div { position: absolute; inset: 0; right: auto; border-radius: 2px; }

      .field-stack { display: grid; gap: 12px; }
      .field-stack input, .field-stack select, .field-stack textarea { width: 100%; border: 1px solid var(--hairline-faint); border-radius: 12px; padding: 14px 16px; background: var(--bg); color: var(--ink); }
      .field-stack textarea { min-height: 140px; resize: vertical; }
      .field-stack input:focus, .field-stack select:focus, .field-stack textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

      .results-bottom-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; }
      .results-left { padding: 52px 56px; border-right: 1px solid var(--hairline-faint); }
      .results-right { padding: 52px 56px; background: var(--surface); }

      .alt-route { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--hairline-faint); }
      .alt-route:last-child { border-bottom: 0; }
      .alt-route .bullet { width: 12px; height: 12px; }
      .alt-route .info { flex: 1; }
      .alt-route .lbl { font-size: 15.5px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
      .alt-route .note { font-size: 13px; color: var(--ink-muted); }
      .alt-route .num { font-size: 22px; font-weight: 600; color: var(--ink); letter-spacing: -0.02em; }

      .lead-note { margin-top: 12px; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--hairline-faint); }
      .lead-form { display: grid; gap: 12px; }
      .lead-form input { width: 100%; padding: 14px 16px; border-radius: 12px; background: var(--bg); border: 1px solid var(--hairline-faint); color: var(--ink); }
      .lead-form input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
      .lead-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
      .lead-list { display: grid; gap: 10px; margin-top: 14px; }
      .lead-item { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--hairline-faint); }
      .lead-item strong { display: block; margin-bottom: 4px; color: var(--ink); }
      .status-ok { color: #2a8a55; font-size: 13.5px; }
      .status-error { color: #b83434; font-size: 13.5px; }

      .two-col { display: grid; grid-template-columns: 1fr 1fr; }
      .two-col > * { padding: 52px 56px; }
      .two-col > *:first-child { border-right: 1px solid var(--hairline-faint); }
      .two-col > *:last-child { background: var(--surface); }

      .opp-row { display: flex; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--hairline-faint); }
      .opp-row:last-child { border-bottom: 0; }
      .opp-row .title { font-weight: 600; color: var(--ink); margin-bottom: 6px; font-size: 15.5px; letter-spacing: -0.005em; }
      .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 8px; }

      @media (max-width: 960px) {
        .topnav, .hero, .mindmap-wrap, .threeways, .isnot, .footer, .progress-row,
        .results-left, .results-right, .two-col > * { padding-left: 24px; padding-right: 24px; }
        .quiz-main { padding: 32px 24px; border-right: 0; border-bottom: 1px solid var(--hairline-faint); }
        .quiz-side { padding: 32px 24px; }
        .quiz-grid, .ways-grid, .isnot-grid, .isnot-cols, .footer, .results-bottom-grid, .two-col { grid-template-columns: 1fr; }
        .results-left { border-right: 0; border-bottom: 1px solid var(--hairline-faint); }
        .two-col > *:first-child { border-right: 0; border-bottom: 1px solid var(--hairline-faint); }
        .h-hero { font-size: 40px; }
        .h-quiz { font-size: 28px; }
        .h-result { font-size: 32px; }
        .mindmap { display: none; }
        .topnav { flex-wrap: wrap; gap: 12px; }
        .topnav nav { order: 3; flex: 1 1 100%; gap: 16px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const A = {
        pink: 'var(--pink)', tan: 'var(--tan)', teal: 'var(--teal)', violet: 'var(--violet)',
        yellow: 'var(--yellow)', mint: 'var(--mint)', lilac: 'var(--lilac)', mauve: 'var(--mauve)', sky: 'var(--sky)', brand: 'var(--brand)',
      };

      // ── i18n ──────────────────────────────────────────────
      const STR = {
        en: {
          nav: { home: 'Overview', quiz: 'Readiness check', analyze: 'Analyze opportunity', discover: 'Discover' },
          startCheck: 'Start check',
          startFreeCheck: 'Start free readiness check',
          analyzeCta: 'Analyze an opportunity',
          eyebrowHero: 'UK Global Talent Visa · Arts & Culture · ACE pathway',
          heroTitleA: 'A ', heroTitleAccent: 'map', heroTitleB: ' of your readiness — not another checklist.',
          heroLede: "Structured information analysis for applicants already in the preparation phase. We map eight dimensions of your profile against current ACE criteria — then show you what's solid, what's thin, and what to do next.",
          hubLabel: 'Your GTV profile',
          hubCaption: 'mapped across 8 dimensions',
          mapNodes: [
            { label: 'Evidence categories', sub: 'Exhibitions · publications · awards' },
            { label: 'ACE criteria',        sub: 'Current Home Office standards' },
            { label: 'Endorsing bodies',    sub: 'Arts Council England & partners' },
            { label: 'Narrative & sequence', sub: 'Why now · why the UK · what next' },
            { label: 'Recommenders',         sub: 'Three verifiable letters' },
            { label: 'Opportunity types',    sub: 'Residencies · screenings · shows' },
            { label: 'Timing & windows',     sub: 'Evidence recency alignment' },
            { label: 'Excluded',             sub: 'Pay-to-publish · pay-to-exhibit' },
          ],
          threeWaysTitle: 'Three ways in',
          threeWaysSub: 'Pick the question actually on your mind right now.',
          allRoutesUseSame: 'All routes use the same reference base',
          ways: [
            { num: '01', title: 'Am I ready to prepare at all?', body: 'A structured 5-minute check. You get a 0–100 readiness map and a gap list — no sales pitch.', cta: 'Start readiness check', go: 'quiz' },
            { num: '02', title: 'Is this opportunity worth it?', body: 'Paste an open call, publication, residency or award. Get a fit judgment scoped to your route.', cta: 'Analyze opportunity', go: 'analyze' },
            { num: '03', title: 'Show me what fits', body: 'Based on route, project, timing and budget — surface tailored, route-aligned options.', cta: 'Discover opportunities', go: 'discover' },
          ],
          isTitle: 'What GTV Insight is',
          isLede: "In 2026, ACE pathway scope is expanding and route confusion is rising. Generic AI tools don't reliably separate current guidance from outdated or adjacent-route material — that's the gap we fill.",
          whatItIs: 'What it is',
          whatItIsNot: 'What it is not',
          isItems: [
            { t: 'Reference base', s: 'A maintained reference on current ACE criteria.' },
            { t: 'Judgment layer', s: 'Judgment over evidence quality and preparation sequencing.' },
            { t: 'Monitoring layer', s: 'Active monitoring across Home Office, ACE, partners.' },
            { t: 'Interface ≠ source', s: 'Delivered through an AI interface — not by an AI.' },
          ],
          isNotItems: [
            { t: 'Not legal advice', s: 'Not a law firm or immigration adviser.' },
            { t: 'Not an agency', s: 'Not a visa agency or document mill.' },
            { t: 'Not a chatbot', s: 'Not a generic chatbot on outdated training data.' },
            { t: 'No vanity evidence', s: 'Never cooperates with pay-to-publish or pay-to-exhibit services.' },
          ],
          footerLede: 'Structured information analysis for UK Global Talent Visa (Arts & Culture) preparation. Not a law firm, visa agency, or immigration adviser.',
          monitoredSources: 'Monitored sources',
          monitoredSourceList: ['Home Office', 'Arts Council England', 'Endorsing bodies & partners'],
          updated: 'Updated',
          updatedDate: '27 Apr 2026',

          // quiz
          questionOf: (n, t) => <>Question {n} <span className="faint" style={{ fontWeight: 400 }}>of {t}</span></>,
          sectionPrefix: 'Section',
          sections: ['Fields & experience', 'Evidence', 'Recommenders', 'Narrative & readiness'],
          progressMap: 'Your progress map',
          provisionalScore: 'Provisional score',
          partial: '/ 100 · partial',

      function Bullet({ color = 'var(--brand)', size = 12, ring, style }) {
        return <span className="bullet" style={{ width: size, height: size, background: color, boxShadow: ring ? `0 0 0 4px ${ring}` : 'none', ...style }} />;
      }

      function MMLine({ x1, y1, x2, y2, dashed }) {
        const midX = (x1 + x2) / 2;
        const d = `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`;
        return <path d={d} stroke="var(--connector)" strokeWidth="1" fill="none" strokeDasharray={dashed ? '4 4' : undefined} strokeLinecap="round" />;
      }

          { id: 'quiz', label: t.nav.quiz },
          { id: 'analyze', label: t.nav.analyze },
          { id: 'discover', label: t.nav.discover },
        ];
        return (
          <div className="topnav">
            <div className="brand-mark" onClick={() => onNav('home')}>
              <Bullet color="var(--brand)" size={14} />
              <span className="name">GTV Insight</span>
            </div>
            <nav>
              {items.map(i => (
                <button key={i.id} className={`nav-item ${i.id === active ? 'active' : ''}`} onClick={() => onNav(i.id)}>

            </nav>
            <div className="lang-toggle" role="tablist" aria-label="Language">

          high: { zh: ['集中保留最强的机构合作、公开成果和第三方背书材料。', '优化推荐信与代表性成果之间的对应关系。', '把专业路径、影响力和申请结构整合成一版主线。'],
                  en: ['Keep the strongest partnerships, public outcomes and third-party backing.', 'Align recommenders with the signature outcomes.', 'Integrate path, influence and structure into one spine.'] },
        },
      };
      function nextSteps(field, band, lang) {
        const map = NEXT_STEPS[field] || NEXT_STEPS['其他 Arts & Culture 相关领域'];
        const entry = map[band] || map.low;
        return entry[lang];
      }

      const ROUTE_SUMMARIES = {
        low:  { zh: '你目前还不适合按这个 route 进入正式申请准备。', en: 'You are not yet ready to formally prepare on this route.' },
        mid:  { zh: '按这个 route 看，你已经有一定基础，但距离稳定申请还差一段。', en: 'On this route you have a basis, but you are not yet at stable-application range.' },
        high: { zh: '按这个 route 看，你已经具备一定申请基础。', en: 'On this route you already have a viable application basis.' },
      };

      function calculateResult(answers, lang) {
        const selectedFields = Array.isArray(answers.fields) && answers.fields.length ? answers.fields : ['其他 Arts & Culture 相关领域'];

        function calcRoute(field) {
          let evidence = 0;
          evidence += evidenceTypeScore(answers.evidenceTypes);
          evidence += SCORE_MAPS.recency[answers.recency] || 0;
          evidence += SCORE_MAPS.sourceNature[answers.sourceNature] || 0;
          evidence += SCORE_MAPS.evidenceStrength[answers.evidenceStrength] || 0;
          evidence += SCORE_MAPS.verifiability[answers.verifiability] || 0;

          let recommenders = 0;
          recommenders += SCORE_MAPS.recommenderCount[answers.recommenderCount] || 0;
          recommenders += recommenderQualityScore(answers.recommenderCount, answers.recommenderQuality);
          recommenders += SCORE_MAPS.lettersConfidence[answers.lettersConfidence] || 0;

          let readiness = 0;
          readiness += SCORE_MAPS.years[answers.years] || 0;
          readiness += SCORE_MAPS.stage[answers.stage] || 0;
          readiness += SCORE_MAPS.narrative[answers.narrative] || 0;
          readiness += SCORE_MAPS.selfReadiness[answers.selfReadiness] || 0;

          let total = evidence + recommenders + readiness;
          const hints = [];

          const evidenceTypes = (answers.evidenceTypes || []).filter(v => v !== '我还不确定哪些算有效证明材料');
          if (evidenceTypes.length < 2) {
            evidence = Math.min(evidence, 28);
            hints.push(hint('weakEvidence', field, lang));
          }
          if (answers.recency === '大多早于 5 年前') { total -= 5; hints.push(hint('oldEvidence', field, lang)); }
          if (answers.sourceNature === '大多来自学生时期项目') { evidence = Math.min(evidence, 22); total -= 8; hints.push(hint('studentProject', field, lang)); }
          if (answers.sourceNature === '大多来自商业项目') { evidence = Math.min(evidence, 22); total -= 8; hints.push(hint('commercialProject', field, lang)); }
          if (answers.recommenderCount === '0 位' || answers.recommenderCount === '1 位') {
            const uncertainOnly = Array.isArray(answers.recommenderQuality) && answers.recommenderQuality.length === 1 && answers.recommenderQuality[0] === '我不确定他们是否符合要求';
            recommenders = Math.min(recommenders, answers.recommenderCount === '0 位' ? 2 : (uncertainOnly ? 3 : 5));
            hints.push(hint('weakLetters', field, lang));
          }
          if (answers.recommenderCount === '2 位') recommenders = Math.min(recommenders, 9);
          if (answers.narrative === '现在还说不清' || answers.narrative === '有一些想法，但比较模糊') hints.push(hint('weakNarrative', field, lang));

          total = Math.max(0, Math.min(100, evidence + recommenders + readiness + (total - (evidence + recommenders + readiness))));

          let band = 'low';
          if (total >= 40 && total <= 69) band = 'mid';
          if (total >= 70) band = 'high';

          return {
            field, label: getRouteLabel(field, lang), total, band,
            summary: ROUTE_SUMMARIES[band][lang],
            metrics: { evidence, recommenders, readiness },
            hints: hints.filter(Boolean).slice(0, 3),
            nextSteps: nextSteps(field, band, lang),
          };
        }

        const routeResults = selectedFields.map(calcRoute).sort((a, b) => b.total - a.total);
        const primary = routeResults[0];
        return {
          total: primary.total, band: primary.band,
          metrics: primary.metrics, hints: primary.hints, nextSteps: primary.nextSteps,
          primaryRecommendation: primary,
          alternateRoutes: routeResults.slice(1),
          routeResults,
        };
      }

      const ROUTE_OPTIONS = [
        { value: 'visual_art', en: 'Visual Art', zh: '视觉艺术' },
        { value: 'design', en: 'Design', zh: '设计' },
        { value: 'fashion', en: 'Fashion', zh: '时装' },
        { value: 'film_tv', en: 'Film / TV', zh: '影视' },
        { value: 'architecture', en: 'Architecture', zh: '建筑' },
        { value: 'performing_arts', en: 'Performing Arts', zh: '表演艺术' },
        { value: 'cross_disciplinary', en: 'Cross-disciplinary', zh: '跨学科' },
      ];

      const OPPORTUNITY_LIBRARY = [
        { id: 'fieldwork_issue_2', name: 'Fieldwork Issue 2', routeTags: ['visual_art','cross_disciplinary'], opportunityType: 'publication', deadlineLabel: '6 May 2026', feeSummary: '~£19', gtvFit: 'yes', why: { en: 'Selection timing is early enough to matter for near-term GTV preparation.', zh: '入选时间靠前，对近期 GTV 准备有意义。' } },
        { id: 'zrfdbck_drift_2026', name: 'ZRFDBCK Drift', routeTags: ['visual_art','cross_disciplinary'], opportunityType: 'exhibition', deadlineLabel: '20 May 2026', feeSummary: '~£19', gtvFit: 'yes', why: { en: 'Fast announcement timeline makes it useful for immediate momentum.', zh: '公布时间快，对当前推进很有帮助。' } },
        { id: 'design_open_lab', name: 'Design Open Lab', routeTags: ['design','cross_disciplinary'], opportunityType: 'institutional_programme', deadlineLabel: '18 May 2026', feeSummary: 'Free', gtvFit: 'warn', why: { en: 'Institutional context is useful, but selection outcome may be less visible externally.', zh: '机构语境有用，但入选结果在外部可见度可能较低。' } },
        { id: 'fashion_image_feature', name: 'Fashion Image Feature', routeTags: ['fashion','visual_art'], opportunityType: 'publication', deadlineLabel: '12 May 2026', feeSummary: '~£15', gtvFit: 'warn', why: { en: 'Can help with visibility, but depends heavily on publication quality.', zh: '能提高曝光，但效果取决于出版物本身的质量。' } },
        { id: 'screening_weekender', name: 'Screening Weekender', routeTags: ['film_tv'], opportunityType: 'screening', deadlineLabel: '30 May 2026', feeSummary: '~£22', gtvFit: 'yes', why: { en: 'Public screening and curatorial selection can become useful evidence.', zh: '公开放映和策展选择可成为可用证据。' } },
        { id: 'performing_arts_residency', name: 'Performing Arts Residency', routeTags: ['performing_arts'], opportunityType: 'residency', deadlineLabel: '10 June 2026', feeSummary: '~£25', gtvFit: 'yes', why: { en: 'Residency plus public showing can generate meaningful evidence if outcomes are documented well.', zh: '驻留加上公开呈现可以形成有价值的证据，前提是记录到位。' } },
      ];

      function fitLabel(v, t) { return v === 'yes' ? t.fitYes : v === 'warn' ? t.fitWarn : t.fitLow; }

      // ── App ───────────────────────────────────────────────
      function App() {
        const [lang, setLang] = React.useState('en');
        const t = STR[lang];

        const [screen, setScreen] = React.useState('home');
        const [step, setStep] = React.useState(0);
        const [answers, setAnswers] = React.useState({});
        const [email, setEmail] = React.useState('');
        const [leadSaved, setLeadSaved] = React.useState(false);
        const [leadSaving, setLeadSaving] = React.useState(false);
        const [leadError, setLeadError] = React.useState('');
        const [savedLeads, setSavedLeads] = React.useState([]);
        const [analyzeInput, setAnalyzeInput] = React.useState({ route: 'visual_art', title: '', deadline: '', text: '', project: '', targetMonth: '' });
        const [discoverInput, setDiscoverInput] = React.useState({ route: 'visual_art', practice: '', project: '', targetMonth: '', budget: '', evidenceNeed: '' });
        const [analysisResult, setAnalysisResult] = React.useState(null);
        const [discoverResults, setDiscoverResults] = React.useState([]);

        const question = QUESTIONS[step];
        const result = React.useMemo(() => calculateResult(answers, lang), [answers, lang]);
        const questionOptions = question && question.getOptions ? question.getOptions(answers) : (question && question.options) || [];

        React.useEffect(() => {
          try {
            const existing = JSON.parse(localStorage.getItem('gtv_leads') || '[]');
            setSavedLeads(Array.isArray(existing) ? existing.reverse() : []);
          } catch (e) { setSavedLeads([]); }
        }, []);

        function navTo(target) {
          if (target === 'quiz') { setScreen('quiz'); setStep(0); }
          else setScreen(target);
        }

        function getDynamicMaxSelect(qid) {
          if (qid !== 'recommenderQuality') return null;
          const c = answers.recommenderCount;
          if (c === '0 位' || c === '1 位') return 1;
          if (c === '2 位') return 2;
          if (c === '3 位') return 3;
          if (c === '4 位或以上') return 4;
          return null;
        }

        function toggleMulti(id, optionKey, maxSelect, exclusiveOption) {
          const effectiveMax = maxSelect || getDynamicMaxSelect(id);
          const current = answers[id] || [];
          const exists = current.includes(optionKey);
          let next = exists ? current.filter(v => v !== optionKey) : [...current, optionKey];
          if (!exists && exclusiveOption) {
            if (optionKey === exclusiveOption) next = [exclusiveOption];
            else next = next.filter(v => v !== exclusiveOption);
          }
          if (!exists && effectiveMax && next.length > effectiveMax) return;
          setAnswers({ ...answers, [id]: next });
        }
        function setSingle(id, optionKey) { setAnswers({ ...answers, [id]: optionKey }); }
        function isAnswered(q) {
          const v = answers[q.id];
          if (q.type === 'multi') return Array.isArray(v) && v.length > 0;
          return Boolean(v);
        }

        function refreshSavedLeads() {
          try {
            const existing = JSON.parse(localStorage.getItem('gtv_leads') || '[]');
            setSavedLeads(Array.isArray(existing) ? existing.reverse() : []);
          } catch (e) { setSavedLeads([]); }
        }
        function exportSavedLeads() {
          try {
            const raw = localStorage.getItem('gtv_leads') || '[]';
            const blob = new Blob([raw], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url; link.download = `gtv-leads-${new Date().toISOString().slice(0, 10)}.json`;
            link.click(); URL.revokeObjectURL(url);
          } catch (e) { setLeadError(lang === 'en' ? 'Export failed.' : '导出失败，请稍后再试。'); }
        }
        function clearSavedLeads() {
          try { localStorage.removeItem('gtv_leads'); setSavedLeads([]); setLeadSaved(false); }
          catch (e) { setLeadError(lang === 'en' ? 'Clear failed.' : '清空失败，请稍后再试。'); }
        }
        async function saveLeadPlaceholder(e) {
          e.preventDefault(); setLeadSaved(false); setLeadError('');
          if (!email.trim()) { setLeadError(lang === 'en' ? 'Please enter an email.' : '请先输入邮箱。'); return; }
          setLeadSaving(true);
          try {
            const existing = JSON.parse(localStorage.getItem('gtv_leads') || '[]');
            existing.push({ email, answers, result, lang, createdAt: new Date().toISOString() });
            localStorage.setItem('gtv_leads', JSON.stringify(existing));
            refreshSavedLeads(); setLeadSaved(true);
          } catch (err) { setLeadError(lang === 'en' ? 'Save failed, please try again.' : '保存失败，请稍后再试。'); }
          finally { setLeadSaving(false); }
        }

        function analyzeOpportunity() {
          if (!analyzeInput.title.trim() && !analyzeInput.text.trim()) return;
          const text = `${analyzeInput.title} ${analyzeInput.text}`.toLowerCase();
          const fit = text.includes('award') || text.includes('institution') || text.includes('festival') || text.includes('publication') ? 'yes' : 'warn';
          const timingTxt = analyzeInput.targetMonth
            ? (lang === 'en'
                ? `If your target submission is around ${analyzeInput.targetMonth}, this looks ${fit === 'yes' ? 'usable' : 'possible but not ideal'} from a timing perspective.`
                : `如果你的目标提交约在 ${analyzeInput.targetMonth}，从时间上看${fit === 'yes' ? '可用' : '可行但不理想'}。`)
            : (lang === 'en' ? 'Add a target submission month to judge timing properly.' : '需要填写目标提交月份才能更准确地判断时间。');
          setAnalysisResult({
            fit,
            strategicImportance: fit === 'yes' ? (lang === 'en' ? 'Core / useful' : '核心 / 有价值') : (lang === 'en' ? 'Optional unless it fills a clear gap' : '可选，除非能补一个明确缺口'),
            successView: fit === 'yes' ? (lang === 'en' ? 'Plausible if the project fit is real and the material is ready.' : '如果项目契合且材料已就绪，是可行的。') : (lang === 'en' ? 'Possible, but competitive and not obviously essential.' : '可能可行，但竞争激烈，且未必是必须的。'),
            gtvValue: fit === 'yes' ? (lang === 'en' ? 'Potentially useful for evidence-building.' : '对证据构建可能有用。') : (lang === 'en' ? 'May help, but not obviously a priority without stronger route fit.' : '可能有帮助，但在 route 契合度更高之前不算明显优先项。'),
            timing: timingTxt,
            recommendation: fit === 'yes' ? (lang === 'en' ? 'Worth considering. Save it and compare against your current evidence gaps.' : '值得考虑。保存下来，与现有证据缺口对照。') : (lang === 'en' ? 'Do not prioritise this until you compare it with stronger route-aligned options.' : '在与更契合 route 的选项对比之前，不建议优先考虑。'),
          });
        }

        function findTailoredOpportunities() {
          const filtered = OPPORTUNITY_LIBRARY.filter((item) => item.routeTags.includes(discoverInput.route) || item.routeTags.includes('cross_disciplinary')).slice(0, 5);
          setDiscoverResults(filtered);
        }

        // ── render helpers ───────────────────────────────────
        function optLabel(opt) { return Array.isArray(opt) ? opt[lang === 'en' ? 1 : 0] : opt; }
        function optKey(opt) { return Array.isArray(opt) ? opt[0] : opt; }

        // ── Landing ──────────────────────────────────────────
        function LandingScreen() {
          const hubX = 590, hubY = 310;
          const positions = [
            { x: 110,  y: 90,  anchor: 'start', color: A.pink },
            { x: 110,  y: 250, anchor: 'start', color: A.tan },
            { x: 110,  y: 410, anchor: 'start', color: A.teal },
            { x: 110,  y: 560, anchor: 'start', color: A.violet },
            { x: 1070, y: 90,  anchor: 'end',   color: A.yellow },
            { x: 1070, y: 250, anchor: 'end',   color: A.mint },
            { x: 1070, y: 410, anchor: 'end',   color: A.lilac },
            { x: 1070, y: 560, anchor: 'end',   color: A.mauve },
          ];
          return (
            <div className="frame">
              <TopNav active="home" onNav={navTo} lang={lang} setLang={setLang} t={t} />

              <div className="hero">
                <div className="eyebrow" style={{ marginBottom: 22 }}>
                  <Bullet color="var(--brand)" size={10} />
                  <span>{t.eyebrowHero}</span>
                </div>
                <h1 className="h-hero">
                  {t.heroTitleA}<span className="accent">{t.heroTitleAccent}</span>{t.heroTitleB}
                </h1>
                <p className="lede">{t.heroLede}</p>
                <div className="cta-row">
                  <button className="btn btn-primary" onClick={() => navTo('quiz')}>{t.startFreeCheck}</button>
                  <button className="btn" onClick={() => navTo('analyze')}>{t.analyzeCta}</button>
                </div>
              </div>

              <div className="mindmap-wrap">
                <div className="mindmap">
                  <svg className="mm-svg" width="1168" height="660" viewBox="0 0 1168 660" preserveAspectRatio="none">
                    {positions.map((n, i) => (
                      <MMLine key={i} x1={hubX} y1={hubY} x2={n.x + (n.anchor === 'end' ? -8 : 8)} y2={n.y} />
                    ))}
                  </svg>
                  <div className="mm-hub" style={{ left: hubX, top: hubY }}>
                    <div className="dot" />
                    <div className="label">{t.hubLabel}</div>
                  </div>
                  <div className="hub-caption" style={{ left: hubX, top: hubY + 60 }}>{t.hubCaption}</div>
                  {positions.map((n, i) => (
                    <div key={i} className={`mm-node ${n.anchor === 'end' ? 'end' : ''}`} style={{ left: n.x, top: n.y }}>
                      <Bullet color={n.color} size={14} />
                      <div>
                        <div className="l-title">{t.mapNodes[i].label}</div>
                        <div className="l-sub">{t.mapNodes[i].sub}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="threeways">
                <div className="head">
                  <div>
                    <h2 className="h-section">{t.threeWaysTitle}</h2>
                    <p>{t.threeWaysSub}</p>
                  </div>
                  <span style={{ fontSize: 13, color: 'var(--ink-muted)' }}>
                    <Bullet color="var(--brand)" size={8} style={{ marginRight: 6 }} /> {t.allRoutesUseSame}
                  </span>
                </div>
                <div className="ways-grid">
                  {t.ways.map((c, i) => {
                    const colors = [A.pink, A.yellow, A.mint];
                    return (
                      <div key={i} className="way-card" onClick={() => navTo(c.go)}>
                        <div className="head-row">
                          <Bullet color={colors[i]} size={14} />
                          <span className="num">{c.num}</span>
                        </div>
                        <h3>{c.title}</h3>
                        <p>{c.body}</p>
                        <div className="cta"><span>{c.cta}</span><span className="arr">→</span></div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="isnot">
                <div className="isnot-grid">
                  <div>
                    <h2 className="h-section">{t.isTitle}</h2>
                    <p>{t.isLede}</p>
                  </div>
                  <div className="isnot-cols">
                    <div>
                      <div className="ucase col-head brand">{t.whatItIs}</div>
                      <div className="bullet-list">
                        {t.isItems.map((it, i) => (
                          <div key={i} className="bullet-item">
                            <Bullet color="var(--brand)" size={12} style={{ marginTop: 7 }} />
                            <div><div className="text">{it.t}</div><div className="sub">{it.s}</div></div>
                          </div>
                        ))}
                      </div>
                    </div>
                    <div>
                      <div className="ucase col-head">{t.whatItIsNot}</div>
                      <div className="bullet-list">
                        {t.isNotItems.map((it, i) => (
                          <div key={i} className="bullet-item">
                            <Bullet color={A.mauve} size={12} style={{ marginTop: 7 }} />
                            <div><div className="text">{it.t}</div><div className="sub">{it.s}</div></div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <Footer t={t} />
            </div>
          );
        }

        // ── Quiz ─────────────────────────────────────────────
        function QuizScreen() {
          const total = QUESTIONS.length;
          const stepNum = step + 1;
          const sectionColor = SECTION_COLORS[question.section] || A.brand;
          const evidenceMax = question.maxSelect || getDynamicMaxSelect(question.id);

          return (
            <div className="frame">
              <TopNav active="quiz" onNav={navTo} lang={lang} setLang={setLang} t={t} />

              <div className="progress-row">
                <span style={{ fontWeight: 600, fontSize: 13.5, color: 'var(--ink)' }}>{t.questionOf(stepNum, total)}</span>
                <div className="progress-bar"><div style={{ width: `${(stepNum / total) * 100}%` }} /></div>
                <span className="muted" style={{ fontSize: 13 }}>{Math.round((stepNum/total)*100)}%</span>
              </div>

              <div className="quiz-grid">
                <div className="quiz-main">
                  <div className="eyebrow" style={{ marginBottom: 18 }}>
                    <Bullet color={sectionColor} size={11} />
                    <span>{t.sectionPrefix} {question.section + 1} · {t.sections[question.section]}</span>
                  </div>
                  <h1 className="h-quiz">{question.title[lang]}</h1>
                  {question.desc && <p className="muted" style={{ fontSize: 15, margin: '14px 0 0', maxWidth: 640, lineHeight: 1.55 }}>{question.desc[lang]}</p>}
                  {question.id === 'evidenceTypes' && (
                    <p className="muted" style={{ fontSize: 14, margin: '14px 0 0' }}>
                      {t.scopedTo}{' '}
                      <strong style={{ color: 'var(--ink)', fontWeight: 600 }}>
                        {Array.isArray(answers.fields) && answers.fields.length
                          ? answers.fields.map(f => getRouteLabel(f, lang)).join(' / ')
                          : t.notSelected}
                      </strong>
                    </p>
                  )}

                  <div className="options">
                    {questionOptions.map((opt, i) => {
                      const key = optKey(opt);
                      const label = optLabel(opt);
                      const selected = question.type === 'multi'
                        ? (answers[question.id] || []).includes(key)
                        : answers[question.id] === key;
                      const dotColor = OPTION_COLORS[i % OPTION_COLORS.length];
                      return (
                        <button key={key}
                          className={`option ${selected ? 'selected' : ''}`}
                          onClick={() => question.type === 'multi'
                            ? toggleMulti(question.id, key, question.maxSelect, question.exclusiveOption)
                            : setSingle(question.id, key)}>
                          <Bullet color={dotColor} size={14} />
                          <div className="label-text">
                            {label}
                            {question.type === 'multi' && evidenceMax ? (
                              <small>{question.exclusiveOption === key ? t.exclusiveHint : t.multiHint(evidenceMax)}</small>
                            ) : null}
                          </div>
                          {selected && (
                            <span className="selected-tag">
                              <Bullet color="var(--brand)" size={7} /> {t.selected}
                            </span>
                          )}
                        </button>
                      );
                    })}
                  </div>

                  <div className="nav-row">
                    <button className="btn" onClick={() => step === 0 ? navTo('home') : setStep(step - 1)}>
                      ← {step === 0 ? t.back : t.prev}
                    </button>
                    <button className="btn btn-primary" disabled={!isAnswered(question)}
                      onClick={() => {
                        if (step < QUESTIONS.length - 1) {
                          if (question.id === 'recommenderCount' && answers.recommenderCount === '0 位') {
                            setAnswers({ ...answers, recommenderQuality: ['我不确定他们是否符合要求'] });
                            setStep(Math.min(step + 2, QUESTIONS.length - 1));
                          } else { setStep(step + 1); }
                        } else { setScreen('result'); }
                      }}>
                      {step < QUESTIONS.length - 1 ? `${t.next} →` : `${t.viewResults} →`}
                    </button>
                  </div>
                </div>

                <div className="quiz-side">
                  <div className="ucase" style={{ marginBottom: 14 }}>{t.progressMap}</div>
                  <div className="sidemap">
                    <svg width="100%" height="100%" style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>
                      {t.sections.map((_, i) => (
                        <MMLine key={i} x1={40} y1={130} x2={180} y2={24 + i * 66} />
                      ))}
                    </svg>
                    <div className="hub" />
                    {t.sections.map((label, i) => {
                      const status = i < question.section ? 'done' : i === question.section ? 'current' : 'todo';
                      const c = SECTION_COLORS[i];
                      return (
                        <div key={i} className={`leaf ${status}`} style={{ top: 24 + i * 66 }}>
                          <Bullet color={status === 'todo' ? 'var(--hairline-faint)' : c} size={12}
                                  ring={status === 'current' ? `${c}40` : undefined} />
                          <div>
                            <div className="name">{label}</div>
                            <div className="stage">{status === 'done' ? t.stageDone : status === 'current' ? t.stageCurrent : t.stageTodo}</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <div className="rule" style={{ margin: '24px 0' }} />

                  <div className="ucase" style={{ marginBottom: 12 }}>{t.provisionalScore}</div>
                  <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 20 }}>
                    <span style={{ fontSize: 52, fontWeight: 600, letterSpacing: '-0.035em', color: 'var(--ink)', lineHeight: 1 }}>{result.total || 0}</span>
                    <span className="muted" style={{ fontSize: 13.5 }}>{t.partial}</span>
                  </div>
                  <div className="mbars">
                    {[
                      { k: 'evidence',     max: 40, c: A.yellow },
                      { k: 'recommenders', max: 25, c: A.mint },
                      { k: 'readiness',    max: 35, c: A.violet },
                    ].map(m => (
                      <div key={m.k}>
                        <div className="mbar-head">
                          <div className="left"><Bullet color={m.c} size={9} /><span className="name">{t.mbarLabels[m.k]}</span></div>
                          <span className="v"><strong>{result.metrics[m.k]}</strong> / {m.max}</span>
                        </div>
                        <div className="mbar-track"><div style={{ width: `${Math.min(100, (result.metrics[m.k]/m.max)*100)}%`, background: m.c }} /></div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              <Footer t={t} />
            </div>
          );
        }

        // ── Results ──────────────────────────────────────────
        function ResultsScreen() {
          const score = result.total;
          const hubX = 220, hubY = 260;
          const axes = [
            { x: 520, y: 110, color: A.yellow, label: t.axisLabels.evidence,     score: `${result.metrics.evidence} / 40` },
            { x: 520, y: 260, color: A.mint,   label: t.axisLabels.recommenders, score: `${result.metrics.recommenders} / 25` },
            { x: 520, y: 410, color: A.violet, label: t.axisLabels.readiness,    score: `${result.metrics.readiness} / 35` },
          ];
          const hints = (result.hints && result.hints.length ? result.hints : [t.notrigger]).slice(0, 6);
          const leaves = hints.map((h, i) => ({ from: i % 3, x: 880, y: 60 + i * 80, color: i % 2 === 0 ? A.pink : A.yellow, label: h.length > 28 ? h.slice(0, 28) + '…' : h }));
          const bandLabel = result.band === 'high' ? t.bandReady : result.band === 'mid' ? t.bandPartial : t.bandEarly;

          return (
            <div className="frame">
              <TopNav active="quiz" onNav={navTo} lang={lang} setLang={setLang} t={t} />

              <div style={{ padding: '56px 56px 36px' }}>
                <div className="eyebrow" style={{ marginBottom: 18 }}>
                  <Bullet color="var(--brand)" size={10} />
                  <span>{t.readinessComplete}</span>
                </div>
                <h1 className="h-result">
                  {result.primaryRecommendation.label} · {result.primaryRecommendation.summary}
                </h1>
                <p className="muted" style={{ fontSize: 16, maxWidth: 720, margin: '14px 0 0', lineHeight: 1.55 }}>
                  {t.analysisDisclaimer}
                </p>
              </div>

              <div style={{ padding: '20px 56px 40px', borderBottom: '1px solid var(--hairline-faint)' }}>
                <div className="mindmap" style={{ height: 560 }}>
                  <svg className="mm-svg" width="1168" height="560" viewBox="0 0 1168 560" preserveAspectRatio="none">
                    {axes.map((a, i) => (<MMLine key={'a'+i} x1={hubX + 28} y1={hubY} x2={a.x - 8} y2={a.y} />))}
                    {leaves.map((l, i) => (<MMLine key={'l'+i} x1={axes[l.from].x + 140} y1={axes[l.from].y} x2={l.x - 8} y2={l.y} dashed />))}
                  </svg>
                  <div style={{ position: 'absolute', left: hubX, top: hubY, transform: 'translate(-50%, -50%)' }}>
                    <div className="score-circle">
                      <div className="num">{score}</div>
                      <div className="lbl">/ 100 · {bandLabel}</div>
                    </div>
                  </div>
                  {axes.map((a, i) => (
                    <div key={i} className="axis-pill" style={{ position: 'absolute', left: a.x, top: a.y, transform: 'translateY(-50%)' }}>
                      <Bullet color={a.color} size={12} />
                      <span className="name">{a.label}</span>
                      <span className="sc">{a.score}</span>
                    </div>
                  ))}
                  {leaves.map((l, i) => (
                    <div key={i} className="mm-node" style={{ left: l.x, top: l.y }}>
                      <Bullet color={l.color} size={11} />
                      <div><div className="l-title" style={{ whiteSpace: 'normal', maxWidth: 260 }}>{l.label}</div></div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="results-bottom-grid">
                <div className="results-left">
                  <h2 className="h-section" style={{ fontSize: 32 }}>{t.nextMoves}</h2>
                  <p className="muted" style={{ fontSize: 14.5, margin: '10px 0 30px' }}>
                    {t.scopedPrimary} <strong style={{ color: 'var(--ink)', fontWeight: 600 }}>{result.primaryRecommendation.label}</strong>.
                  </p>
                  <div className="step-list">
                    {result.primaryRecommendation.nextSteps.map((s, i) => {
                      const c = [A.yellow, A.mint, A.violet, A.pink][i % 4];
                      return (
                        <div key={i} className="step-item">
                          <Bullet color={c} size={14} />
                          <div>
                            <div className="num">0{i + 1}</div>
                            <div className="title">{s}</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <div className="rule" style={{ margin: '36px 0 28px' }} />
                  <div className="ucase" style={{ marginBottom: 14 }}>{t.openThreads}</div>
                  <div className="bullet-list">
                    {hints.map((h, i) => (
                      <div key={i} className="bullet-item">
                        <Bullet color={A.tan} size={12} style={{ marginTop: 7 }} />
                        <div><div className="text" style={{ fontWeight: 500 }}>{h}</div></div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="results-right">
                  <div className="ucase" style={{ marginBottom: 14 }}>{t.alternateRoutes}</div>
                  {result.alternateRoutes.length ? (
                    <div>
                      {result.alternateRoutes.map((r, i) => (
                        <div key={r.label} className="alt-route">
                          <Bullet color={[A.teal, A.lilac, A.sky, A.mauve][i % 4]} size={12} />
                          <div className="info">
                            <div className="lbl">{r.label}</div>
                            <div className="note">{r.summary}</div>
                          </div>
                          <span className="num">{r.total}</span>
                          <span className="faint">→</span>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="muted">{t.onlyOneRoute}</div>
                  )}

                  <div className="rule" style={{ margin: '32px 0 24px' }} />
                  <div className="ucase" style={{ marginBottom: 14 }}>{t.saveResult}</div>
                  <p className="muted" style={{ fontSize: 14, margin: '0 0 14px', lineHeight: 1.55 }}>{t.saveLede}</p>
                  <form className="lead-form" onSubmit={saveLeadPlaceholder}>
                    <input type="email" required placeholder={lang === 'en' ? 'Your email' : '你的邮箱'} value={email} onChange={(e) => setEmail(e.target.value)} />
                    <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                      <button type="submit" className="btn btn-primary" disabled={leadSaving}>{leadSaving ? t.saving : t.saveBtn}</button>
                      <button type="button" className="btn" onClick={() => { setScreen('quiz'); setStep(0); setAnswers({}); setEmail(''); setLeadSaved(false); setLeadError(''); }}>{t.retake}</button>
                    </div>
                    {leadSaved && <div className="status-ok">{t.savedOk}</div>}
                    {leadError && <div className="status-error">{leadError}</div>}
                  </form>
                  <div className="lead-toolbar">
                    <button type="button" className="btn btn-sm" onClick={refreshSavedLeads}>{t.refresh}</button>
                    <button type="button" className="btn btn-sm" onClick={exportSavedLeads} disabled={!savedLeads.length}>{t.exportJson}</button>
                    <button type="button" className="btn btn-sm" onClick={clearSavedLeads} disabled={!savedLeads.length}>{t.clear}</button>
                  </div>
                  <div className="lead-list">
                    <div className="muted">{t.leadCount(savedLeads.length)}</div>
                    {savedLeads.slice(0, 3).map((lead, idx) => (
                      <div className="lead-item" key={`${lead.email}-${lead.createdAt}-${idx}`}>
                        <strong>{lead.email}</strong>
                        <div className="muted">{t.score} {lead?.result?.total ?? '-'} · {lead.createdAt ? new Date(lead.createdAt).toLocaleString() : '-'}</div>
                      </div>
                    ))}
                  </div>
                  <div className="lead-note">
                    <div style={{ fontWeight: 600, marginBottom: 6, color: 'var(--ink)' }}>{t.questionsCta}</div>
                    <div className="muted">
                      {t.contactPrefix}<a href="mailto:gtvinsight@gmail.com?subject=GTV%20Insight%20Consultation">gtvinsight@gmail.com</a>
                    </div>
                  </div>
                </div>
              </div>

              <Footer t={t} />
            </div>
          );
        }

        // ── Analyze ──────────────────────────────────────────
        function AnalyzeScreen() {
          return (
            <div className="frame">
              <TopNav active="analyze" onNav={navTo} lang={lang} setLang={setLang} t={t} />
              <div style={{ padding: '56px 56px 36px' }}>
                <div className="eyebrow" style={{ marginBottom: 18 }}>
                  <Bullet color={A.yellow} size={10} />
                  <span>{t.analyzeEyebrow}</span>
                </div>
                <h1 className="h-result">{t.analyzeTitle}</h1>
                <p className="muted" style={{ fontSize: 16, maxWidth: 720, margin: '14px 0 0', lineHeight: 1.55 }}>{t.analyzeLede}</p>
              </div>

              <div className="two-col">
                <div>
                  <div className="ucase" style={{ marginBottom: 18 }}>{t.opportunityInput}</div>
                  <div className="field-stack">
                    <select value={analyzeInput.route} onChange={(e) => setAnalyzeInput({ ...analyzeInput, route: e.target.value })}>
                      {ROUTE_OPTIONS.map(o => <option key={o.value} value={o.value}>{o[lang]}</option>)}
                    </select>
                    <input placeholder={t.oppTitle} value={analyzeInput.title} onChange={(e) => setAnalyzeInput({ ...analyzeInput, title: e.target.value })} />
                    <input placeholder={t.deadline} value={analyzeInput.deadline} onChange={(e) => setAnalyzeInput({ ...analyzeInput, deadline: e.target.value })} />
                    <input placeholder={t.targetMonth} value={analyzeInput.targetMonth} onChange={(e) => setAnalyzeInput({ ...analyzeInput, targetMonth: e.target.value })} />
                    <textarea placeholder={t.oppDesc} value={analyzeInput.text} onChange={(e) => setAnalyzeInput({ ...analyzeInput, text: e.target.value })} />
                    <button className="btn btn-primary" onClick={analyzeOpportunity} style={{ justifySelf: 'start' }}>{t.analyzeBtn}</button>
                  </div>
                </div>
                <div>
                  <div className="ucase" style={{ marginBottom: 18 }}>{t.analyzeResult}</div>
                  {analysisResult ? (
                    <div className="bullet-list">
                      <div className="bullet-item"><Bullet color={A.yellow} size={12} style={{ marginTop: 7 }} /><div><div className="text">{t.fit} · {fitLabel(analysisResult.fit, t)}</div><div className="sub">{analysisResult.successView}</div></div></div>
                      <div className="bullet-item"><Bullet color={A.mint} size={12} style={{ marginTop: 7 }} /><div><div className="text">{t.strategicImportance} · {analysisResult.strategicImportance}</div><div className="sub">{analysisResult.gtvValue}</div></div></div>
                      <div className="bullet-item"><Bullet color={A.violet} size={12} style={{ marginTop: 7 }} /><div><div className="text">{t.timing}</div><div className="sub">{analysisResult.timing}</div></div></div>
                      <div className="bullet-item"><Bullet color="var(--brand)" size={12} style={{ marginTop: 7 }} /><div><div className="text">{t.recommendation}</div><div className="sub">{analysisResult.recommendation}</div></div></div>
                    </div>
                  ) : (<div className="muted" style={{ fontSize: 14 }}>{t.analyzeEmpty}</div>)}
                </div>
              </div>
              <Footer t={t} />
            </div>
          );
        }

        // ── Discover ─────────────────────────────────────────
        function DiscoverScreen() {
          return (
            <div className="frame">
              <TopNav active="discover" onNav={navTo} lang={lang} setLang={setLang} t={t} />
              <div style={{ padding: '56px 56px 36px' }}>
                <div className="eyebrow" style={{ marginBottom: 18 }}>
                  <Bullet color={A.mint} size={10} />
                  <span>{t.discoverEyebrow}</span>
                </div>
                <h1 className="h-result">{t.discoverTitle}</h1>
                <p className="muted" style={{ fontSize: 16, maxWidth: 720, margin: '14px 0 0', lineHeight: 1.55 }}>{t.discoverLede}</p>
              </div>

              <div className="two-col">
                <div>
                  <div className="ucase" style={{ marginBottom: 18 }}>{t.yourProfile}</div>
                  <div className="field-stack">
                    <select value={discoverInput.route} onChange={(e) => setDiscoverInput({ ...discoverInput, route: e.target.value })}>
                      {ROUTE_OPTIONS.map(o => <option key={o.value} value={o.value}>{o[lang]}</option>)}
                    </select>
                    <input placeholder={t.practice} value={discoverInput.practice} onChange={(e) => setDiscoverInput({ ...discoverInput, practice: e.target.value })} />
                    <input placeholder={t.currentProject} value={discoverInput.project} onChange={(e) => setDiscoverInput({ ...discoverInput, project: e.target.value })} />
                    <input placeholder={t.targetMonth} value={discoverInput.targetMonth} onChange={(e) => setDiscoverInput({ ...discoverInput, targetMonth: e.target.value })} />
                    <input placeholder={t.budget} value={discoverInput.budget} onChange={(e) => setDiscoverInput({ ...discoverInput, budget: e.target.value })} />
                    <input placeholder={t.evidenceNeed} value={discoverInput.evidenceNeed} onChange={(e) => setDiscoverInput({ ...discoverInput, evidenceNeed: e.target.value })} />
                    <button className="btn btn-primary" onClick={findTailoredOpportunities} style={{ justifySelf: 'start' }}>{t.findOpts}</button>
                  </div>
                </div>
                <div>
                  <div className="ucase" style={{ marginBottom: 18 }}>{t.tailored}</div>
                  {discoverResults.length ? discoverResults.map((item, i) => {
                    const c = [A.pink, A.yellow, A.mint, A.violet, A.teal][i % 5];
                    return (
                      <div className="opp-row" key={item.id}>
                        <Bullet color={c} size={12} style={{ marginTop: 6 }} />
                        <div style={{ flex: 1 }}>
                          <div className="title">{item.name}</div>
                          <div className="chip-row">
                            <span className="chip"><Bullet color={c} size={8} />{item.opportunityType}</span>
                            {item.routeTags.map((t2) => <span className="chip" key={t2}>{t2}</span>)}
                          </div>
                          <div className="muted" style={{ fontSize: 13.5, marginTop: 4 }}>{item.why[lang]}</div>
                        </div>
                        <div style={{ textAlign: 'right', minWidth: 120 }}>
                          <div style={{ fontSize: 13, color: 'var(--ink)', fontWeight: 600 }}>{item.deadlineLabel}</div>
                          <div className="muted" style={{ fontSize: 12.5 }}>{fitLabel(item.gtvFit, t)} · {item.feeSummary}</div>
                        </div>
                      </div>
                    );
                  }) : (<div className="muted" style={{ fontSize: 14 }}>{t.discoverEmpty}</div>)}
                </div>
              </div>
              <Footer t={t} />
            </div>
          );
        }

        if (screen === 'home')     return <LandingScreen />;
        if (screen === 'quiz')     return <QuizScreen />;
        if (screen === 'result')   return <ResultsScreen />;
        if (screen === 'analyze')  return <AnalyzeScreen />;
        if (screen === 'discover') return <DiscoverScreen />;
        return <LandingScreen />;
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
